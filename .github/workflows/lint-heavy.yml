name: lint-heavy

on:
  push:
    branches: [main, dev]
    paths:
      - "skills/**"
      - "tools/**"
      - "evals/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/lint-heavy.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "evals/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/lint-heavy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tier-1 skill lint (anatomy + eval presence)
        run: bash tools/validate-skills.sh
      - name: Validate plugin versions and cache identities
        env:
          PLUGIN_VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLUGIN_INITIAL_PUBLISH: ${{ github.event_name == 'push' && github.event.created }}
        run: |
          if [[ "$PLUGIN_INITIAL_PUBLISH" == "true" ]]; then
            python3 tools/validate-plugin-versions.py --initial-publish
          else
            python3 tools/validate-plugin-versions.py --base-ref "$PLUGIN_VERSION_BASE_REF"
          fi
      - name: Tier-2 routing evals (min rank-1 80%)
        run: python3 tools/run-routing-evals.py --min-rank1 80
      - name: Validate behavioral eval corpus
        run: python3 tools/run-behavioral-evals.py --validate-only
      - name: Run behavioral harness protocol smoke (fake provider; not model quality)
        run: |
          printf '%s\n' '{"default":{"candidate":true,"baseline":false}}' > /tmp/fake-eval-scenario.json
          FAKE_EVAL_SCENARIO=/tmp/fake-eval-scenario.json \
          python3 tools/run-behavioral-evals.py \
            --provider-command "python3 evals/providers/fake-provider.py" \
            --artifacts-dir "$RUNNER_TEMP/behavioral-evals"

  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.216
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          claude plugin validate plugins/lattice
