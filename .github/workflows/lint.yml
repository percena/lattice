name: lint

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "plugins/**"
      - "tools/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "skills/**"
      - "plugins/**"
      - "tools/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all scripts (warning severity)
        run: |
          find skills plugins tools -name '*.sh' -print0 | xargs -0 shellcheck -S warning

  symlink-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail on broken symlinks (plugin skills point at repo-root skills/)
        run: |
          broken=$(find . -type l ! -exec test -e {} \; -print)
          if [ -n "$broken" ]; then
            echo "Broken symlinks found:"
            echo "$broken"
            exit 1
          fi
