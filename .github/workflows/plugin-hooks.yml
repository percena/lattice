name: plugin-hooks

on:
  push:
    branches: [main]
    paths:
      - "plugins/lattice/**"
      - ".github/workflows/plugin-hooks.yml"
  pull_request:
    paths:
      - "plugins/lattice/**"
      - ".github/workflows/plugin-hooks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run lattice hook tests
        working-directory: plugins/lattice
        run: bats scripts/tests/
