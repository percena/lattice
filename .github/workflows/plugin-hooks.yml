name: plugin-hooks

on:
  push:
    branches: [main, dev]
    paths:
      - "plugins/lattice/**"
      - ".github/workflows/plugin-hooks.yml"
  pull_request:
    paths:
      - "plugins/lattice/**"
      - ".github/workflows/plugin-hooks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats (1.13.0 — matches lattice-scripts.yml + ci-local; spc-254 A9)
        # Pin bats-core to v1.13.0 so this CI matches lattice-scripts.yml and
        # tools/ci-local.sh. Ubuntu apt only ships bats 1.10.0, whose `[[ ]]`
        # -masking + recursive test-name handling differs and makes hook suites
        # diverge from the lattice-scripts suite semantics (#246, spc-254 F7).
        # install.sh from the v1.13.0 tag is deterministic (no apt/npm drift).
        # tkt-463 A15: a git tag is mutable — verify the clone resolves to the
        # pinned commit (tools/.bats-pin, single source shared with ci-local.sh)
        # before executing install.sh under sudo.
        env:
          BATS_PIN_FILE: tools/.bats-pin
        run: |
          BATS_TAG=$(sed -n 's/^tag=//p' "$BATS_PIN_FILE")
          BATS_SHA=$(sed -n 's/^sha=//p' "$BATS_PIN_FILE")
          git clone --depth 1 --branch "$BATS_TAG" https://github.com/bats-core/bats-core.git /tmp/bats-core
          got=$(git -C /tmp/bats-core rev-parse HEAD)
          if [ "$got" != "$BATS_SHA" ]; then
            echo "bats-core $BATS_TAG resolved to $got, expected pinned $BATS_SHA (tag moved?) — refusing to install" >&2
            exit 1
          fi
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq python3 2>/dev/null || true
      - name: Run lattice hook tests
        working-directory: plugins/lattice
        run: bats --print-output-on-failure scripts/tests/
