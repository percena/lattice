name: artifacts

# L0 artifact-contract gate (tkt-92): validate-lattice-artifacts.py previously
# ran only inside ci-local, so binder/spec drift on the integration branch was
# enforced by nothing — 19 stranded binders survived a "zero warnings" milestone.
on:
  push:
    branches: [main, dev]
    paths:
      - ".lattice/**"
      - "tools/validate-lattice-artifacts.py"
      - ".github/workflows/artifacts.yml"
  pull_request:
    paths:
      - ".lattice/**"
      - "tools/validate-lattice-artifacts.py"
      - ".github/workflows/artifacts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lattice-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Lattice artifacts (binders, specs, reviews)
        run: python3 tools/validate-lattice-artifacts.py
