name: lattice-scripts

on:
  push:
    branches: [main, dev]
    paths:
      - "skills/**"
      - "tools/**"
      - "evals/**"
      - ".github/workflows/lattice-scripts.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "evals/**"
      - ".github/workflows/lattice-scripts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats-matrix:
    name: bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats (1.13.0 — matches local + ci-local; #246)
        # Pin bats-core to v1.13.0 so CI matches the local dev bats (homebrew
        # 1.13.0) and tools/ci-local.sh. Ubuntu apt only ships bats 1.10.0,
        # whose `[[ ]]`-masking + recursive test-name handling differs and
        # makes tools/tests/bats-assertion-ergonomics.bats "semantics proof"
        # meta-test fail on every PR (#246). install.sh from the v1.13.0 tag
        # is deterministic (no apt/npm registry version drift).
        # tkt-463 A15: a git tag is mutable — verify the clone resolves to the
        # pinned commit (tools/.bats-pin, single source shared with ci-local.sh)
        # before executing install.sh under sudo.
        env:
          BATS_PIN_FILE: tools/.bats-pin
        run: |
          BATS_TAG=$(sed -n 's/^tag=//p' "$BATS_PIN_FILE")
          BATS_SHA=$(sed -n 's/^sha=//p' "$BATS_PIN_FILE")
          git clone --depth 1 --branch "$BATS_TAG" https://github.com/bats-core/bats-core.git /tmp/bats-core
          got=$(git -C /tmp/bats-core rev-parse HEAD)
          if [ "$got" != "$BATS_SHA" ]; then
            echo "bats-core $BATS_TAG resolved to $got, expected pinned $BATS_SHA (tag moved?) — refusing to install" >&2
            exit 1
          fi
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq python3 2>/dev/null || true
      - name: Run skill script tests (all suites discovered)
        run: |
          suites=()
          while IFS= read -r d; do suites+=("$d"); done < <(find skills tools -type d \( -path '*/scripts/tests' -o -path 'tools/tests' \) | sort)
          echo "suites: ${suites[*]}"
          # tkt-463: print the failing test's captured output so a runner-only
          # failure (timing, BSD tools) is diagnosable from the log.
          bats --print-output-on-failure "${suites[@]}"

  # tkt-463: dev branch protection requires a check literally named `bats`.
  # The matrix (#451) renamed the reporting checks to `bats (<os>)`, so the
  # required context never reported and every PR sat BLOCKED. This aggregate
  # job is the single `bats` context; it fails if any matrix leg did not succeed.
  bats:
    needs: bats-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate skill script test matrix
        env:
          RESULT: ${{ needs.bats-matrix.result }}
        run: |
          echo "bats-matrix result: $RESULT"
          [ "$RESULT" = "success" ]
